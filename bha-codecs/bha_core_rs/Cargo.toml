[package]
name = "bha-core-rs"
version = "0.1.0"
edition = "2021"
description = "Rust acceleration for bha_core hot paths (delta encoder, dedup substring)"
license = "Project-internal"

[lib]
# Single .so/.pyd/.dll exposed as `bha_core_rs` Python module
name = "bha_core_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }

[profile.release]
# Optimize for speed — this is a hot-path library
opt-level = 3
lto = true
codegen-units = 1
strip = true