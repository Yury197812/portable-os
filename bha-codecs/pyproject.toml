[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bha-core"
version = "1.0.0"
description = "Production BHA codec pipeline — adaptive int encoder, v10 round-trip safe preprocessors, parallel orchestrator, v11 telemetry-driven recommender, multi-codec benchmark harness."
readme = "bha_core/README.md"
requires-python = ">=3.10"
license = { text = "Project-internal" }
keywords = [
    "compression",
    "codec",
    "bha",
    "archiver",
    "preprocessor",
    "parallel",
    "lzma",
    "recommender",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Compression",
]

# Hard runtime dependency — the BHA black_hole_archiver package
# must be on PYTHONPATH (or symlinked into the environment).
# See INSTALL.md for setup instructions.
dependencies = [
    # No hard PyPI dependencies — stdlib only (csv, io, json, lzma,
    # multiprocessing, statistics, threading, etc.).
    # The BHA runtime is loaded via sys.path manipulation; not
    # installable from PyPI.
]

[project.optional-dependencies]
# Codecs registered by bench_codecs.py — install the ones you need.
codecs = [
    "brotli>=1.0",          # brotli_11, brotli_6
    "lz4>=4.0",             # lz4_12 (frame), lz4_block_hc (block)
    "zstandard>=0.18",      # zstd_22, zstd_3
    "python-snappy>=0.6",   # snappy
    "zopfli>=0.4",          # zopfli_deflate_15 (slow but high-ratio deflate)
]
# Rust acceleration: ~14× speedup on bha_delta._adaptive_encode_int
# hot path. Requires pip install bha-core[rust] (separate build).
# bha_core gracefully falls back to pure-Python if not installed.
rust = [
    "bha-core-rs @ file://./bha_core_rs/target/wheels/bha_core_rs-0.1.0-cp310-abi3-win_amd64.whl",
]

# Convenience: everything for full benchmark
all = [
    "bha-core[codecs,rust]",
]

[project.urls]
# No Source URL — this package is project-internal, not on PyPI.
# See INSTALL.md in the parent project for setup.

# -----------------------------------------------------------------------------
# Entry points
# -----------------------------------------------------------------------------
[project.scripts]
# CLI: python -m bha_core.bha --bench file.csv
bha-pack = "bha_core.bha:_cli"
bha-orchestrate = "bha_core.bha_parallel:_cli_orchestrator"

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------
[tool.setuptools]
platforms = ["Windows"]  # Tested primarily on Windows; BHA runtime is Win-only

[tool.setuptools.packages.find]
where = ["."]
include = ["bha_core*"]
namespaces = false

[tool.setuptools.package-data]
# Non-Python files that must ship with the package.
# catalog.ini — codec catalog (BHA magics + descriptions)
# rules.json  — v11 recommender rules (generated by recommender_v11.py)
# Both are loaded at runtime via Path(__file__).parent / NAME.
"bha_core" = ["catalog.ini", "rules.json", "README.md"]

# -----------------------------------------------------------------------------
# pytest configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Default marker descriptions (must match conftest.py registration)
markers = [
    "requires_bha: Tests that need the BHA runtime at D:\\PROJECT UNIVERSE\\01Compression\\BHA",
    "slow: Tests that take >1 second",
    "integration: End-to-end integration tests",
]
addopts = [
    "-ra",  # show summary of all test outcomes
    "--strict-markers",  # fail on unknown markers
    "--tb=short",  # shorter tracebacks
]