# ---------------------------------------------------------------------------
# v10 preprocessor gates (added 2026-08-21)
# These are NOT new file_codec magics — they run inside worker_gate() as
# preprocessors and append a sidecar (u32 LE length + sidecar bytes) to the
# LZMA2 envelope. Decoder reverses: extract sidecar, decode LZMA2, apply
# preprocessor-specific undo.
# ---------------------------------------------------------------------------
[v10_preprocessor]
format_name=BHV2_DEDUP
gate_function=pp_dedup_substring_safe
encoder=pp_dedup_substring_safe
decoder=decode_dedup_substring
sidecar_format=u32_le_length+original_substring
description=Find longest repeated substring, replace second occurrence with back-ref token (0xFF + u32 LE dist + u32 LE length), store original substring in sidecar.
test_wins_over_lzma=7 files of 45 in v10-pp-gates

[v10_preprocessor]
format_name=BHV2_BCJX
gate_function=pp_bcj_x86_safe
encoder=pp_bcj_x86_safe
decoder=decode_bcj_x86
sidecar_format=u32_le_count+count*u32_le_original_offsets
description=x86 BCJ filter: zero out 4 bytes after each E8/E9, store original offsets in sidecar.
test_wins_over_lzma=5 files of 45 in v10-pp-gates

[v10_preprocessor]
format_name=BHV2_ZEXT
gate_function=pp_zero_extend_safe
encoder=pp_zero_extend_safe
decoder=NOT_IMPLEMENTED
sidecar_format=u32_le_count (not yet used for roundtrip — gate disabled)
description=Strip 4 leading zero bytes from 8-byte aligned int32 values.
status=LOSSY (decoder needs per-position sidecar, future work)
